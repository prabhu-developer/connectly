[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,PORT,CORS_ORIGIN"
  SECRETS_SCAN_OMIT_PATHS = "README.md,apps/server/README.md,apps/web/README.md,docs/**"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Root and health checks
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Express API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true
