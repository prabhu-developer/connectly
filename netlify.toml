[build]
  command = "pnpm --filter server build"
  publish = "apps/server/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Root and health checks
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# Express API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# Fallback catch-all to serverless API
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
